<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Loja Poliglota{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('catalog') }}">🛍️ Loja Poliglota</a>
  <nav>
    <a href="{{ url_for('catalog') }}">Catálogo</a>
    <a href="{{ url_for('cart_view') }}">Carrinho ({{ session.get('cart', {})|length }})</a>
    {% if session.get('admin') %}
      <a href="{{ url_for('admin_panel') }}">Painel</a>
      <a href="{{ url_for('logout') }}">Sair</a>
    {% else %}
      <a href="{{ url_for('login') }}">Admin</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
